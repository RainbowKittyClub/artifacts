# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
# Minecraft ships deobfuscated since 26.1, so there is no mappings artifact.
# Per-version keys (game, Fabric API, Polymer, kalic0re, pack format, data version, dev ports) live
# in versions/<v>/gradle.properties.
fabric_loader_version=0.19.3
loom_version=1.17.19
shadow_version=9.6.1

# Java toolchain — read by build.gradle, fabric.mod.json and the mixins json. One place to bump.
java_version=25

# Shaded from mavenLocal; rebuild kalic0re with publishToMavenLocal when its shared helpers
# change. Only the common/ subpackages listed here come across.
kalic0re_shared_packages=item,effect,enchant,death,click

# Datagen: the enchantment/tag/lang providers write raw JSON and extend
# FabricLanguageProvider, so none needs a client instance to generate.
enable_datagen=true
datagen_client=false

# Quilt Loader, for the optional `runQuiltServer` task only (see gradle/devserver.gradle).
# Quilt has no stable 26.2 release yet, so this tracks the newest actively-updated beta. The rest are
# the loader's runtime libs from its installer manifest (quilt-loader-<ver>.json), which maven
# metadata doesn't expose — keep them in step when bumping quilt_loader_version.
quilt_loader_version=0.31.0-beta.4
quilt_sponge_mixin_version=0.17.4+mixin.0.8.7
quilt_json5_version=1.0.4+final
quilt_config_version=1.3.3
quilt_asm_version=9.10.1
quilt_mixinextras_version=0.5.5

# Dev-server defaults seeded into run/ by configureRunServer (see gradle/devserver.gradle).
# Give a mod sharing a workspace its own ports, outside 25565-25567 (Docker publishes that range).
dev_rcon_password=dev
# Name the dev client joins under. Skips the offline-mode name prompt and is opped in run/ops.json.
dev_client_username=TestPlayer


# Mod Properties
mod_version = 0.1.0
mod_name = Artifacts
mod_description = Wearable and enchantable artifacts for the Rainbow Kitty Club server.
mod_authors = ["Kalic0"]
mod_website = https://github.com/rainbowkittyclub/artifacts
mod_issues = https://github.com/rainbowkittyclub/artifacts/issues
mod_license = Unlicense


# Project Properties
maven_group = club.rainbowkitty.artifacts
mod_id = artifacts
entrypoint = club.rainbowkitty.artifacts.Main
stonecutter_version=0.9.8
# Multi-version build: one node per version under versions/, see gradle/stonecutter-opt-in.sh.
stonecutter_versions=26.2,26.3
stonecutter_vcs_version=26.2
dev.kikugie.stonecutter.hard_mode=true
